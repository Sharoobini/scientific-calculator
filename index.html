
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Scientific Calculator</title>

    <link rel="stylesheet" href="style.css">

    <!-- Math.js library -->
    <script src="https://unpkg.com/mathjs@15.2.0/lib/browser/math.js"></script>

    <script src="script.js" defer></script>
</head>

<body>

    <main class="calculator">

        <header class="topbar">
            <div>
                <p class="small-title">SMART TOOLS</p>
                <h1>Scientific Calculator</h1>
            </div>

            <button id="angleMode" class="mode-button">DEG</button>
        </header>

        <section class="screen">
            <div id="expression" class="expression">0</div>
            <div id="result" class="result">Ready</div>
        </section>

        <section class="keypad" id="keypad">

            <button class="key utility" data-action="clear">AC</button>
            <button class="key utility" data-action="delete">DEL</button>
            <button class="key" data-value="(">(</button>
            <button class="key" data-value=")">)</button>
            <button class="key operator" data-value="/">÷</button>

            <button class="key function" data-value="sin(">sin</button>
            <button class="key function" data-value="cos(">cos</button>
            <button class="key function" data-value="tan(">tan</button>
            <button class="key function" data-value="sqrt(">√</button>
            <button class="key function" data-value="^2">x²</button>

            <button class="key function" data-value="log10(">log</button>
            <button class="key function" data-value="log(">ln</button>
            <button class="key function" data-value="pi">π</button>
            <button class="key function" data-value="e">e</button>
            <button class="key function" data-value="^">xʸ</button>

            <button class="key" data-value="7">7</button>
            <button class="key" data-value="8">8</button>
            <button class="key" data-value="9">9</button>
            <button class="key operator" data-value="*">×</button>
            <button class="key function" data-value="!">x!</button>

            <button class="key" data-value="4">4</button>
            <button class="key" data-value="5">5</button>
            <button class="key" data-value="6">6</button>
            <button class="key operator" data-value="-">−</button>
            <button class="key function" data-value="1/(">1/x</button>

            <button class="key" data-value="1">1</button>
            <button class="key" data-value="2">2</button>
            <button class="key" data-value="3">3</button>
            <button class="key operator" data-value="+">+</button>
            <button class="key function" data-value="%">mod</button>

            <button class="key zero" data-value="0">0</button>
            <button class="key" data-value=".">.</button>
            <button class="key function" data-value="ans">Ans</button>
            <button class="key equals" data-action="calculate">=</button>

        </section>

        <p class="hint">
            Scientific Calculator | DEG / RAD
        </p>

    </main>

</body>
</html>
